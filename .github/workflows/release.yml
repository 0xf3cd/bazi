name: Prepare or Publish Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Rehearse only, or explicitly publish the tested release
        type: choice
        options: [rehearsal, release]
        default: rehearsal
        required: true

permissions: {}
concurrency:
  group: bazi-release
  cancel-in-progress: false

jobs:
  preflight:
    if: inputs.mode == 'release'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - &release-tools
        name: Load trusted release tooling
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$WORKFLOW_SHA" == "$SHA" && "$RUNNER_TEMP" == /* ]] || exit 1
          status="$(curl --fail --silent --show-error --proto '=https' --max-time 60 \
            --output "$RUNNER_TEMP/run_release.py" --write-out '%{http_code}' \
            "https://raw.githubusercontent.com/$REPOSITORY/$SHA/run_release.py")"
          test "$status" = 200
      - name: Require an existing protected release environment
        env:
          MODE: ${{ inputs.mode }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        shell: bash
        run: python -I "$RUNNER_TEMP/run_release.py" preflight

  build:
    needs: [preflight]
    if: ${{ !cancelled() && (inputs.mode == 'rehearsal' || (inputs.mode == 'release' && needs.preflight.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      manifest-sha: ${{ steps.bundle.outputs.manifest-sha }}
      version: ${{ steps.bundle.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify source identity
        env:
          SHA: ${{ github.sha }}
          MODE: ${{ inputs.mode }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        shell: bash
        run: python -I "$GITHUB_WORKSPACE/run_release.py" source
      - name: Install development requirements
        run: |
          receipt="$RUNNER_TEMP/outer-pip.txt"
          test ! -e "$receipt"
          python -m pip --version >> "$receipt"
          python -m pip install -r Requirements.txt
          python -m pip --version >> "$receipt"
          python -m pip install -r docs/requirements.txt
          python -m pip --version >> "$receipt"
          python -m pip install celestial-calendar==0.6.1
      - name: Run full gate and retain its tested pair
        run: >-
          python run_tests.py -a -v --package-output-dir "$RUNNER_TEMP/bundle/dist"
          --environment-report "$RUNNER_TEMP/raw-environments.json"
          --outer-installer-report "$RUNNER_TEMP/outer-pip.txt"
      - name: Seal release bundle
        id: bundle
        env:
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          MODE: ${{ inputs.mode }}
        shell: bash
        run: python -I "$GITHUB_WORKSPACE/run_release.py" seal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: tested-release
          path: ${{ runner.temp }}/bundle/
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  pypi:
    needs: [preflight, build]
    if: inputs.mode == 'release' && needs.preflight.result == 'success' && needs.build.result == 'success' && github.repository == '0xf3cd/bazi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - *release-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: &download
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: artifact
          merge-multiple: true
          digest-mismatch: error
      - &verify
        name: Verify exact same-run bundle
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          MANIFEST_SHA: ${{ needs.build.outputs.manifest-sha }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          MODE: ${{ inputs.mode }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        shell: bash
        run: python -I "$RUNNER_TEMP/run_release.py" verify
      - name: Reject existing version, tag or release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: python -I "$RUNNER_TEMP/run_release.py" check-existing
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: artifact/dist/
          skip-existing: false

  github-release:
    needs: [preflight, build, pypi]
    if: inputs.mode == 'release' && needs.preflight.result == 'success' && needs.pypi.result == 'success' && github.repository == '0xf3cd/bazi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - *release-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: *download
      - *verify
      - name: Verify PyPI bytes and create the tag and release without overwriting
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python -I "$RUNNER_TEMP/run_release.py" publish
