name: Claude Review (manual)

# No automatic trigger: Claude is an on-demand review seat, so a failed optional review
# cannot block unrelated pull requests.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: number

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write # exchanged for the action's scoped GitHub App token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the PR branch
        run: gh pr checkout --detach "${{ inputs.pr_number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: anthropics/claude-code-action@e63208cb983318a44e3f945e959ef894b707dcfa # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            contents: read
            pull_requests: write
            issues: write
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ inputs.pr_number }}

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            Note: The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level feedback only. Do not modify repository files, branches, commits, pull requests, or issues.
            Never quote paths, hostnames, or tooling from outside this repository, even when a file in the repo mentions them.

          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash(gh pr comment ${{ inputs.pr_number }}:*),Bash(gh pr diff ${{ inputs.pr_number }}:*),Bash(gh pr view ${{ inputs.pr_number }}:*)"

