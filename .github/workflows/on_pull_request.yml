name: Workflow on Pull Request - Run All Tests with pytest

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-on-ubuntu:
    name: test-on-ubuntu (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            scope: --runtime-only
          - python-version: "3.12" # minimum documentation-tooling version
            scope: ""
          - python-version: "3.14"
            scope: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f Requirements.txt ]; then pip install -r Requirements.txt; fi
          python -m pip install celestial-calendar==0.6.1
      - name: Install documentation dependencies
        if: matrix.python-version != '3.11'
        run: python -m pip install -r docs/requirements.txt
      - name: Testing, linting, and statc type checking
        run: |
          chmod +x ./run_tests.py
          ./run_tests.py -a -v ${{ matrix.scope }}

  test-on-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.14"] # latest only; version coverage lives on ubuntu

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f Requirements.txt ]; then pip install -r Requirements.txt; fi
          python -m pip install celestial-calendar==0.6.1
          python -m pip install -r docs/requirements.txt
      - name: Testing, linting, and statc type checking
        run: |
          chmod +x ./run_tests.py
          ./run_tests.py -a -v

  test-on-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.14"] # latest only; guards platform encoding/path quirks

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "Requirements.txt") { python -m pip install -r "Requirements.txt" }
          python -m pip install celestial-calendar==0.6.1
          python -m pip install -r docs/requirements.txt
      - name: Testing, linting, and statc type checking
        run: |
          chcp.com 65001
          $env:PYTHONIOENCODING = "utf-8"
          python ./run_tests.py -a -v
