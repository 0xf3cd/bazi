name: Publish Documentation

on:
  workflow_dispatch:
    inputs:
      version:
        description: dev, or a vMAJOR.MINOR.PATCH release tag
        type: string
        default: dev
        required: true
      mode:
        description: rehearsal only builds; publish archives a build; pending lists a release whose docs are not ready; promote marks a read-back version ready; resume redeploys the archive
        type: choice
        options: [rehearsal, publish, pending, promote, resume]
        default: rehearsal
        required: true
      initialize:
        description: Create the docs-site archive branch; valid only while it does not exist
        type: boolean
        default: false
        required: true

permissions: {}
concurrency:
  group: bazi-docs
  cancel-in-progress: false

jobs:
  build:
    if: inputs.mode == 'rehearsal' || inputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - &identity
        name: Resolve documentation source identity
        id: identity
        if: inputs.mode == 'rehearsal' || inputs.mode == 'publish'
        env:
          LABEL: ${{ inputs.version }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import json, os, re, subprocess, urllib.request
          label, sha, repository = os.environ['LABEL'], os.environ['SHA'], os.environ['REPOSITORY']
          if not re.fullmatch(r'[0-9a-f]{40}', sha) or not re.fullmatch(r'[\w.-]+/[\w.-]+', repository):
            raise SystemExit('Invalid dispatch identity')
          def get(url, accept):
            with urllib.request.urlopen(urllib.request.Request(url, headers={'Accept': accept}), timeout=30) as response:
              return json.load(response)
          if label == 'dev':
            ref = commit = sha
          elif re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', label):
            ref = f'refs/tags/{label}'
            listing = subprocess.check_output(['git', 'ls-remote', f'https://github.com/{repository}.git', ref, ref + '^{}'], text=True)
            refs = {name: value for value, name in (line.split('\t') for line in listing.splitlines())}
            commit = refs.get(ref + '^{}', refs.get(ref, ''))
            if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit(f'Tag {label} does not exist')
            release = get(f'https://api.github.com/repos/{repository}/releases/tags/{label}', 'application/vnd.github+json')
            assets = [asset for asset in release.get('assets', []) if asset.get('name') == 'release.json']
            if release.get('draft') is not False or release.get('prerelease') is not False or len(assets) != 1:
              raise SystemExit(f'{label} is not a published release carrying release.json')
            metadata = get(assets[0]['browser_download_url'], 'application/octet-stream')
            expected = {'name': 'bazi', 'version': label[1:], 'sha': commit, 'repository': repository, 'mode': 'release'}
            if not isinstance(metadata, dict) or {key: metadata.get(key) for key in expected} != expected:
              raise SystemExit(f'release.json of {label} does not name tag commit {commit}')
          else:
            raise SystemExit('Expected dev or vMAJOR.MINOR.PATCH')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f'ref={ref}\ncommit={commit}\n')
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.identity.outputs.ref }}
          persist-credentials: false
      - name: Verify checkout and documentation runner
        env:
          LABEL: ${{ inputs.version }}
          COMMIT: ${{ steps.identity.outputs.commit }}
        shell: python
        run: |
          import os, subprocess
          from pathlib import Path
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != os.environ['COMMIT']:
            raise SystemExit('Checkout differs from the resolved documentation commit')
          if not all(Path(name).is_file() for name in ('run_docs.py', 'run_doc_checks.py', 'docs/requirements.txt')):
            raise SystemExit(f"{os.environ['LABEL']} ships no documentation runner; only such versions can be archived")
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install documentation requirements of the checked-out source
        run: |
          python -m pip install -r docs/requirements.txt
          python -m pip install celestial-calendar==0.6.1
      - name: Build, check and pack the candidate
        env:
          LABEL: ${{ inputs.version }}
        run: |
          python -B run_docs.py --version "$LABEL" --output-dir "$RUNNER_TEMP/docs"
          tar -cf "$RUNNER_TEMP/site.tar" -C "$RUNNER_TEMP/docs/html" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: docs-candidate
          path: ${{ runner.temp }}/site.tar
          if-no-files-found: error
          overwrite: false
          retention-days: 1

  check:
    if: inputs.mode == 'promote'
    runs-on: ubuntu-latest
    permissions: {}
    env:
      LABEL: ${{ inputs.version }}
      COMMIT: ''
    outputs:
      commit: ${{ steps.readback.outputs.commit }}
      digest: ${{ steps.readback.outputs.digest }}
    steps:
      - &readback
        name: Read back the live site against the archive commit
        id: readback
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: python
        run: |
          import hashlib, io, json, os, subprocess, tarfile, time, urllib.request
          label, commit, url = os.environ['LABEL'], os.environ['COMMIT'], 'https://github.com/0xf3cd/bazi.git'
          if not commit:
            commit = subprocess.check_output(['git', 'ls-remote', '--heads', url, 'refs/heads/docs-site'], text=True).split('\t')[0]
          subprocess.run(['git', 'init', '-q', 'expected'], check=True)
          subprocess.run(['git', '-C', 'expected', 'fetch', '-q', '--depth=1', '--no-tags', url, 'refs/heads/docs-site'], check=True)
          if subprocess.check_output(['git', '-C', 'expected', 'rev-parse', 'FETCH_HEAD'], text=True).strip() != commit:
            raise SystemExit('docs-site no longer points at the commit to read back; read back the newest archive instead')
          with tarfile.open(fileobj=io.BytesIO(subprocess.check_output(['git', '-C', 'expected', 'archive', '--format=tar', commit]))) as archive:
            expected = {member.name: archive.extractfile(member).read() for member in archive if member.isfile()}
          entries = {entry['label']: entry for entry in json.loads(expected['versions.json'])['versions']}
          if label not in entries:
            raise SystemExit(f'{label} is not in the archive')
          # Every file of the archive commit is read back, so a retained version that differs on the live site fails as well.
          paths = sorted(expected)
          query = f"?run={os.environ['RUN_ID']}-{os.environ['RUN_ATTEMPT']}"
          def fetch(path):
            with urllib.request.urlopen('https://0xf3cd.github.io/bazi/' + path + query, timeout=30) as response:
              return response.read()
          deadline = time.monotonic() + 900
          while True:
            try:
              live = {path: fetch(path) for path in paths}
              stale = [path for path in paths if live[path] != expected[path]]
            except OSError as error:
              stale = [repr(error)]
            if not stale:
              break
            if time.monotonic() > deadline:
              raise SystemExit(f'Live site still differs from archive {commit} after 15 minutes: {stale[:5]}')
            print(f'Not live yet: {stale[:5]}')
            time.sleep(30)
          # Each archived version's digest is recomputed from the live bytes with the assembler's algorithm.
          digests = {}
          for other, entry in entries.items():
            if entry['state'] != 'pending':
              listing = ''.join(f'{hashlib.sha256(live[name]).hexdigest()}  {name[len(other) + 1:]}\n' for name in paths if name.startswith(other + '/'))
              digests[other] = hashlib.sha256(listing.encode('utf-8')).hexdigest()
              if digests[other] != entry['digest']:
                raise SystemExit(f'Live {other} digest differs from versions.json')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f"commit={commit}\ndigest={digests.get(label, '')}\n")
          print(f'All {len(paths)} files of archive {commit} are live; the digests of {len(digests)} archived versions match versions.json')

  archive:
    needs: [build, check]
    if: ${{ !cancelled() && github.repository == '0xf3cd/bazi' && github.ref == 'refs/heads/main' && ((inputs.mode == 'publish' && needs.build.result == 'success') || (inputs.mode == 'promote' && needs.check.result == 'success') || inputs.mode == 'pending' || inputs.mode == 'resume') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - *identity
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.mode == 'publish'
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: candidate
          merge-multiple: true
          digest-mismatch: error
      - name: Read the archive branch
        id: read
        env:
          INITIALIZE: ${{ inputs.initialize }}
          EXPECTED: ${{ needs.check.outputs.commit }}
        shell: python
        run: |
          import hashlib, json, os, re, subprocess, tarfile
          url, initialize, expected = 'https://github.com/0xf3cd/bazi.git', os.environ['INITIALIZE'] == 'true', os.environ['EXPECTED']
          found = subprocess.run(['git', 'ls-remote', '--exit-code', '--heads', url, 'refs/heads/docs-site'], capture_output=True, text=True, check=False)
          if found.returncode not in (0, 2):
            raise SystemExit('Cannot query the docs-site branch')
          head = found.stdout.split('\t')[0] if found.returncode == 0 else ''
          if (head == '') != initialize or (head and not re.fullmatch(r'[0-9a-f]{40}', head)):
            raise SystemExit('initialize must be true exactly when docs-site does not exist yet')
          if expected and head != expected:
            raise SystemExit('docs-site moved after the live check; dispatch promote again')
          listing = {}
          if head:
            git = ['git', '-C', 'archive']
            subprocess.run(['git', 'init', '-q', 'archive'], check=True)
            subprocess.run([*git, 'fetch', '-q', '--depth=1', '--no-tags', url, 'refs/heads/docs-site'], check=True)
            if subprocess.check_output([*git, 'rev-parse', 'FETCH_HEAD'], text=True).strip() != head:
              raise SystemExit('docs-site moved while it was read')
            for line in subprocess.check_output([*git, 'ls-tree', '-r', '-z', '--full-tree', head], text=True).split('\0')[:-1]:
              meta, path = line.split('\t', 1)
              mode, kind, blob = meta.split(' ')
              if (mode, kind) != ('100644', 'blob'):
                raise SystemExit(f'Archive entry is not a regular file: {path}')
              listing[path] = blob
            subprocess.run([*git, 'archive', '--format=tar', '-o', os.path.abspath('archive.tar'), head], check=True)
            with tarfile.open('archive.tar') as archive:
              exported = {member.name: hashlib.sha1(b'blob %d\0' % member.size + archive.extractfile(member).read()).hexdigest() for member in archive if member.isfile()}
            if exported != listing:
              raise SystemExit('git archive output differs from the archive tree')
          with open('archive.json', 'w', encoding='utf-8') as stream:
            json.dump(listing, stream)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f'parent={head}\n')
      - name: Apply the requested archive change
        env:
          MODE: ${{ inputs.mode }}
          LABEL: ${{ inputs.version }}
          COMMIT: ${{ steps.identity.outputs.commit }}
          DIGEST: ${{ needs.check.outputs.digest }}
          PARENT: ${{ steps.read.outputs.parent }}
        shell: python
        run: |
          import json, os, subprocess, sys
          mode = os.environ['MODE']
          change = {
            'publish': ['archive', '--candidate', 'candidate/site.tar', '--commit', os.environ['COMMIT']],
            'pending': ['pending'], 'promote': ['promote', '--verified-digest', os.environ['DIGEST']], 'resume': ['current'],
          }[mode]
          source = ['--archive', 'archive.tar'] if os.environ['PARENT'] else ['--initialize']
          command = [sys.executable, '-I', '-B', 'control/run_docs_site.py', change[0], *source, '--label', os.environ['LABEL'], '--output', 'site', *change[1:]]
          print(json.dumps(json.loads(subprocess.check_output(command, text=True)), indent=2))
      - name: Commit on a staging branch through GraphQL, check it, then fast-forward docs-site
        id: commit
        env:
          MODE: ${{ inputs.mode }}
          LABEL: ${{ inputs.version }}
          PARENT: ${{ steps.read.outputs.parent }}
          CONTROL: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          mode, label, parent, run = os.environ['MODE'], os.environ['LABEL'], os.environ['PARENT'], os.environ['RUN_ID']
          repository = '/repos/0xf3cd/bazi'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'}
          def call(method, path, data=None):
            body = None if data is None else json.dumps(data).encode()
            with urllib.request.urlopen(urllib.request.Request('https://api.github.com' + path, data=body, headers=headers, method=method), timeout=60) as response:
              content = response.read()
            return json.loads(content) if content else {}
          def blob_id(content):
            return hashlib.sha1(b'blob %d\0' % len(content) + content).hexdigest()
          def tree_id(files):
            # Git tree id of path -> blob id with every entry a 100644 file, the only kind the read step admits; Git orders a subtree as its name plus '/'.
            entries, subtrees = [], {}
            for name, blob in files.items():
              head, slash, rest = name.partition('/')
              if slash:
                subtrees.setdefault(head, {})[rest] = blob
              else:
                entries.append((head.encode(), b'100644 ' + head.encode() + b'\0' + bytes.fromhex(blob)))
            entries += [(head.encode() + b'/', b'40000 ' + head.encode() + b'\0' + bytes.fromhex(tree_id(children))) for head, children in subtrees.items()]
            content = b''.join(entry for _, entry in sorted(entries))
            return hashlib.sha1(b'tree %d\0' % len(content) + content).hexdigest()
          old = json.loads(Path('archive.json').read_text(encoding='utf-8'))
          site = {path.relative_to('site').as_posix(): path.read_bytes() for path in sorted(Path('site').rglob('*')) if path.is_file()}
          blobs = {name: blob_id(content) for name, content in site.items()}
          generated = ('index.html', 'versions.json', 'versions/index.html')
          for name in sorted(old.keys() | blobs.keys()):
            if old.get(name) == blobs.get(name):
              continue
            own = mode == 'publish' and name.startswith(label + '/') and (label == 'dev' or name not in old)
            if not ((mode != 'resume' and name in generated and name in blobs) or own):
              raise SystemExit(f'Refusing archive change outside {label}/: {name}')
          commit = parent
          if blobs != old:
            base, deletions = parent, sorted(old.keys() - blobs.keys())
            if not parent:
              # createCommitOnBranch only appends to an existing branch, so initialization starts the staging branch at the control commit
              # this job checked out, once GitHub reports that commit's signature valid. The first archive commit writes the whole site
              # and deletes every other control path; docs-site itself is created only after that commit passes the checks.
              control = os.environ['CONTROL']
              answer = call('POST', '/graphql', {'variables': {'oid': control},
                'query': 'query($oid: GitObjectID!) { repository(owner: "0xf3cd", name: "bazi") { object(oid: $oid) { ... on Commit { oid signature { isValid } } } } }'})
              start = ((answer.get('data') or {}).get('repository') or {}).get('object') or {}
              if start.get('oid') != control or (start.get('signature') or {}).get('isValid') is not True:
                raise SystemExit(f"GitHub reports no valid signature on control commit {control}; docs-site was not created: {answer.get('errors')}")
              listing = subprocess.check_output(['git', '-C', 'control', 'ls-tree', '-r', '-z', '--full-tree', control], text=True)
              base, deletions = control, sorted({line.split('\t', 1)[1] for line in listing.split('\0')[:-1]} - blobs.keys())
            staging = f"docs-site-staging-{run}-{os.environ['RUN_ATTEMPT']}"
            call('POST', repository + '/git/refs', {'ref': 'refs/heads/' + staging, 'sha': base})
            try:
              changes = {'additions': [{'path': name, 'contents': base64.b64encode(site[name]).decode()} for name in sorted(blobs) if old.get(name) != blobs[name]],
                'deletions': [{'path': name} for name in deletions]}
              result = call('POST', '/graphql', {
                'query': 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit {'
                  ' oid tree { oid } parents(first: 2) { nodes { oid } } signature { isValid wasSignedByGitHub } } } }',
                'variables': {'input': {'branch': {'repositoryNameWithOwner': '0xf3cd/bazi', 'branchName': staging}, 'expectedHeadOid': base,
                  'message': {'headline': f'docs: {mode} {label}', 'body': f'Workflow run {run}.'}, 'fileChanges': changes}}})
              created = ((result.get('data') or {}).get('createCommitOnBranch') or {}).get('commit')
              if result.get('errors') or not created:
                raise SystemExit(f"createCommitOnBranch failed: {result.get('errors')}")
              # docs-site moves only to a commit with the expected single parent, exactly the assembled tree and a valid GitHub signature.
              if [node['oid'] for node in created['parents']['nodes']] != [base]:
                raise SystemExit('GitHub committed onto another parent; docs-site was not moved')
              if created['tree']['oid'] != tree_id(blobs):
                raise SystemExit('GitHub committed a tree that differs from the assembled site; docs-site was not moved')
              signature = created['signature'] or {}
              if signature.get('isValid') is not True or signature.get('wasSignedByGitHub') is not True:
                raise SystemExit('GitHub did not sign the archive commit; docs-site was not moved')
              commit = created['oid']
              if parent:
                call('PATCH', repository + '/git/refs/heads/docs-site', {'sha': commit, 'force': False})
              else:
                call('POST', repository + '/git/refs', {'ref': 'refs/heads/docs-site', 'sha': commit})
            finally:
              try:
                call('DELETE', repository + '/git/refs/heads/' + staging)
              except OSError as error:
                print(f'::warning::Staging branch {staging} was not deleted: {error}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f'commit={commit}\n')
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: [archive]
    if: ${{ !cancelled() && needs.archive.result == 'success' && github.repository == '0xf3cd/bazi' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse to deploy a superseded archive
        env:
          COMMIT: ${{ needs.archive.outputs.commit }}
        shell: python
        run: |
          import os, subprocess
          head = subprocess.check_output(['git', 'ls-remote', '--heads', 'https://github.com/0xf3cd/bazi.git', 'refs/heads/docs-site'], text=True).split('\t')[0]
          if head != os.environ['COMMIT']:
            raise SystemExit('docs-site moved after this run archived it; dispatch resume to deploy the newest archive')
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

  readback:
    needs: [archive, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      LABEL: ${{ inputs.version }}
      COMMIT: ${{ needs.archive.outputs.commit }}
    steps:
      - *readback
