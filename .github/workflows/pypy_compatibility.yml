name: Workflow for PyPy Compatibility - Run Partial Tests with pytest

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pypy-version: ["pypy3.11"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PyPy ${{ matrix.pypy-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.pypy-version }}
      - name: Install dependencies
        # This job never runs ruff/mypy/package builds, so skip those tools and typing-only stubs. Mypy 2.x pulls in
        # ast-serialize (Rust/PyO3), which needs a slow cargo build under PyPy.
        # `coverage` stays: run_tests.py imports it unconditionally at module level.
        run: |
          pypy -m ensurepip
          pypy -m pip install --upgrade pip
          grep -v -E '^(ruff|mypy|build|setuptools|twine)==|^types-' Requirements.txt > requirements-pypy.txt
          pypy -m pip install -r requirements-pypy.txt
      - name: Testing
        run: |
          pypy ./run_tests.py -s -hko -d -i -osmoke
