name: Workflow on Push - Run Partial Tests with pytest

on:
  push:
    branches: [ main ] # post-merge sanity only; PR branches are covered by the PR workflow

permissions:
  contents: read

jobs:
  test-on-ubuntu:
    name: test-on-ubuntu (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            scope: --runtime-only
          - python-version: "3.14"
            scope: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f Requirements.txt ]; then pip install -r Requirements.txt; fi
          python -m pip install celestial-calendar==0.6.1
      - name: Install documentation dependencies
        if: matrix.python-version != '3.11'
        run: python -m pip install -r docs/requirements.txt
      - name: Testing, linting, and statc type checking
        run: |
          chmod +x ./run_tests.py
          ./run_tests.py -ruff -mypy -osmoke ${{ matrix.scope }}

  test-on-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f Requirements.txt ]; then pip install -r Requirements.txt; fi
          python -m pip install celestial-calendar==0.6.1
          python -m pip install -r docs/requirements.txt
      - name: Testing, linting, and statc type checking
        run: |
          chmod +x ./run_tests.py
          ./run_tests.py -ruff -mypy -osmoke

  test-on-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "Requirements.txt") { python -m pip install -r "Requirements.txt" }
          python -m pip install celestial-calendar==0.6.1
          python -m pip install -r docs/requirements.txt
      - name: Testing, linting, and statc type checking
        run: |
          chcp.com 65001
          $env:PYTHONIOENCODING = "utf-8"
          python ./run_tests.py -ruff -mypy -osmoke
