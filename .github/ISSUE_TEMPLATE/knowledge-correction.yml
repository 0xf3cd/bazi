name: 知识勘误与出处补充
description: 更正某条知识，或为它补充可核对的出处。
title: "[知识] "
body:
  - type: markdown
    attributes:
      value: |
        提交前请读 [CONTRIBUTING.md](https://github.com/0xf3cd/bazi/blob/main/CONTRIBUTING.md) 的“出处要求”与“来源状态的含义”。
        本库不收没有出处的规则。表单只收集线索，不是可直接导入的 JSON；不完整信息可先讨论，入库前由维护者核对补齐，不编造链接或占位值。
        来源分组（`lineage`）、`source_id`、来源状态（`state`）与文本层（`text_layer`）由维护者核定。
  - type: input
    id: claim_id
    attributes:
      label: 条目 ID（claim_id）
      description: 要更正或补出处的条目，如 `shishen.bijian.definition`；可在仓库的 bazi/knowledge_data.json 中查找，找不到可先描述条文，新增条目留空。
    validations:
      required: false
  - type: textarea
    id: text
    attributes:
      label: 条目文字（text）
      description: 现有文字有误时，写出你认为应有的文字；只补出处则写“不变”。
    validations:
      required: true
  - type: input
    id: work
    attributes:
      label: 作品（work）
      description: 书名、文章名或页面标题。
    validations:
      required: true
  - type: input
    id: attribution
    attributes:
      label: 来源署名（attribution）
      description: 作者或注者；原文未署名则注明“未署名”。
    validations:
      required: true
  - type: input
    id: edition
    attributes:
      label: 版本（edition）
      description: 所用刻本、影印本、点校本或电子书的出版信息。
    validations:
      required: true
  - type: input
    id: locator
    attributes:
      label: 位置（locator）
      description: 页码、卷次或章节。
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 链接（url）
      description: 所用版本的在线原文链接。没有链接时，在下方“现有内容的问题”中提供纸本版本与可查线索；正式来源记录仍须由维护者补齐真实的非空 url。
    validations:
      required: false
  - type: input
    id: text_layer
    attributes:
      label: 文本层（text_layer）
      description: 描述摘录出自白文正文、注释或原创说明；不确定请写明。维护者核对后映射为 baiwen、zhushi 或 editorial，未说明不代表记录允许空值。
    validations:
      required: false
  - type: textarea
    id: excerpt
    attributes:
      label: 原文摘录（excerpt）
      description: 逐字摘出，保留原有字词、标点与异体字，不改写。
    validations:
      required: true
  - type: textarea
    id: supports
    attributes:
      label: 支持什么（supports）
      description: 这段原文支持上面哪条结论。
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: 限度（limitations）
      description: 这段原文没有说什么，或不能推出什么。
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 现有内容的问题
      description: 现有条目哪里有误或缺出处；新增条目可写“新增”。
    validations:
      required: true
